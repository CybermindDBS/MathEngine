# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
    paths:
    - "mathengine-core/**"
    - ".github/workflows/mathengine-core-ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
    - "mathengine-core/**"
    - ".github/workflows/mathengine-core-ci.yml"
    
env:
  IMAGE: ghcr.io/cyberminddbs/mathengine-core

jobs:
  build:

    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    defaults:
      run:
        working-directory: mathengine-core

    env:
      EUREKA_CLIENT_ENABLED: "false"
      MANAGEMENT_TRACING_ENABLED: "false"
      LOGGING_FILE_PATH: target/logs

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        cache-dependency-path: mathengine-core/pom.xml
    - name: Build and test
      run: mvn -B package
      
    - name: Log in to GitHub Container Registry
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Set up Docker Buildx
      if: github.ref == 'refs/heads/main'
      uses: docker/setup-buildx-action@v3
    
    - name: Build and push image
      if: github.ref == 'refs/heads/main'
      uses: docker/build-push-action@v6
      with:
        context: mathengine-core
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
